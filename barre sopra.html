<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden; 
        background: #060619;
    }

    .letterbox {
        position: absolute;
        width: 100%; height: 100%;
        overflow: hidden;
        transform: scaleX(-1); /* Specchio */
    }

    .background {
        position: absolute;
        inset: 0;
        background: 
            radial-gradient(circle at 70% 40%, rgba(255, 77, 255, 0.08), transparent 40%),
            radial-gradient(circle at 30% 60%, rgba(0, 229, 255, 0.08), transparent 40%),
            #060619; 
        animation: slowDrift 20s ease-in-out infinite alternate;
    }

    .dust {
        position: absolute;
        inset: 0;
        background-image: 
            radial-gradient(1px 1px at 10% 20%, #00e5ff, transparent),
            radial-gradient(1.2px 1.2px at 50% 50%, #fff, transparent),
            radial-gradient(1px 1px at 80% 80%, #ff4dff, transparent);
        background-size: 100% 100%;
        opacity: 0.2;
        animation: dustFloat 15s infinite alternate;
    }

    .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(to bottom, rgba(255, 255, 255, 0.02) 0px, transparent 2px, transparent 4px);
    }

    @keyframes slowDrift {
        from { transform: scale(1); }
        to { transform: scale(1.05) translate(1%, 1%); }
    }

    @keyframes dustFloat {
        from { opacity: 0.1; transform: translateY(0); }
        to { opacity: 0.3; transform: translateY(-10px); }
    }
</style>
</head>
<body>
    <div class="letterbox">
        <div class="background"></div>
        <div class="dust"></div>
        <div class="scanlines"></div>
    </div>
</body>
</html>
