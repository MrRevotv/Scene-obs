<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<title>Cinematic Letterbox Dust - Standard</title>
<style>
    html, body {
        margin: 0; padding: 0;
        width: 100%; height: 100%;
        overflow: hidden; background: #050510;
    }

    .letterbox {
        position: absolute;
        width: 100%; height: 100%;
        overflow: hidden;
    }

    /* Sfondo più dinamico */
    .background {
        position: absolute;
        inset: -20%;
        background:
            radial-gradient(circle at 70% 30%, rgba(123,47,247,0.18), transparent 40%),
            radial-gradient(circle at 30% 70%, rgba(0,210,255,0.15), transparent 45%),
            radial-gradient(circle at center, #0a0a20, #030308 70%);
        filter: blur(60px);
        animation: slowDrift 25s ease-in-out infinite alternate;
    }

    /* Polvere Spaziale */
    .dust {
        position: absolute;
        inset: 0;
        background-image: 
            radial-gradient(1px 1px at 20px 30px, #fff, rgba(0,0,0,0)),
            radial-gradient(1.5px 1.5px at 100px 150px, #fff, rgba(0,0,0,0)),
            radial-gradient(1px 1px at 200px 50px, rgba(255,255,255,0.8), rgba(0,0,0,0));
        background-size: 300px 300px;
        opacity: 0.15;
        animation: dustMove 60s linear infinite;
    }

    .scanlines {
        position: absolute;
        inset: 0;
        background: repeating-linear-gradient(to bottom, rgba(255,255,255,0.03) 0px, rgba(255,255,255,0.03) 1px, transparent 2px, transparent 4px);
        opacity: 0.08;
        pointer-events: none;
    }

    @keyframes slowDrift {
        0% { transform: scale(1) translate(0, 0) rotate(0deg); }
        100% { transform: scale(1.1) translate(-2%, 3%) rotate(1deg); }
    }

    @keyframes dustMove {
        from { transform: translateY(0); }
        to { transform: translateY(-300px); }
    }
</style>
</head>
<body>
    <div class="letterbox">
        <div class="background"></div>
        <div class="dust"></div>
        <div class="scanlines"></div>
    </div>
</body>
</html>
